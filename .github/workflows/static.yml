name: Deploy Event Desk V4

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Event Desk
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Event Desk
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Event Desk
        uses: actions/deploy-pages@v4
        id: deployment
